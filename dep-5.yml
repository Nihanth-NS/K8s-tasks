apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      volumes:
      - name: secrets-path
        secret:
          secretName: db-secret
      - name: VolumePvc
        PersistentVolumeClaim:
          claimName: pvc
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        volumeMounts:
        - name: secret-path
          mountPath: "/etc/secret-path-volume"
        - name: VolumePvc
          mountPath: "/etc/pvc-path"
        env:
          - name: APP_MODE
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: APP_MODE
          - name: APP_VERSION
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: APP_VERSION
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 1